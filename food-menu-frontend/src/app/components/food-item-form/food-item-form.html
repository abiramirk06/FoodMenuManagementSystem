
<div class="form-container">

  <h2>{{ isEditMode ? 'Edit Food Item' : 'Add Food Item' }}</h2>

  <form #foodForm="ngForm" (ngSubmit)="submitForm()">

    <div class="form-group">
      <label>Food Name</label>
      <input
        type="text"
        name="name"
        [(ngModel)]="formData.name"
        placeholder="Enter food name"
        required
        #name="ngModel">

      <small class="error" *ngIf="name.invalid && name.touched">
        Food name is required.
      </small>
    </div>

    <div class="form-group">
      <label>Category</label>
      <input
        type="text"
        name="category"
        [(ngModel)]="formData.category"
        placeholder="Enter category"
        required
        #category="ngModel">

      <small class="error" *ngIf="category.invalid && category.touched">
        Category is required.
      </small>
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea
        name="description"
        [(ngModel)]="formData.description"
        placeholder="Enter food description">
      </textarea>
    </div>

    <div class="form-group">
      <label>Price (₹)</label>
      <input
        type="number"
        name="price"
        [(ngModel)]="formData.price"
        placeholder="Enter price"
        required
        min="1"
        #price="ngModel">

      <small class="error" *ngIf="price.invalid && price.touched">
        Enter a valid price greater than zero.
      </small>
    </div>

    <div class="form-group checkbox-group">
      <input
        type="checkbox"
        id="isAvailable"
        name="isAvailable"
        [(ngModel)]="formData.isAvailable">

      <label for="isAvailable">Available</label>
    </div>

    <div class="form-actions">

      <button
        type="submit"
        class="save-button"
        [disabled]="foodForm.invalid">
        {{ isEditMode ? 'Update Food Item' : 'Save Food Item' }}
      </button>

      <button
        type="button"
        class="cancel-button"
        (click)="cancelForm()">
        Cancel
      </button>

    </div>

  </form>

</div>
